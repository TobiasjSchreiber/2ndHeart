<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2ndHeart — Configurator</title>
  <meta name="theme-color" content="#efefed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="view">
    <canvas id="c" aria-label="3D-Vorschau des Gehäuses"></canvas>

    <header class="brand">
      <span class="brand-name">2ndHeart</span>
    </header>

    <div class="readout" id="readout" aria-live="polite">000 × 000 × 00</div>

    <div class="tools">
      <button id="boardBtn" class="icon-btn is-on" aria-pressed="true" title="Mainboard ein/aus">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="1.5"/><rect x="7" y="9" width="5" height="5"/><path d="M15 9h3M15 12h3M15 15h3M3 9H1M3 15H1"/></svg>
      </button>
      <button id="resetBtn" class="icon-btn" title="Ansicht zurücksetzen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
      </button>
    </div>

    <div class="fold">
      <button id="playBtn" class="play" aria-label="Falten abspielen">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>
      </button>
      <span class="fold-lbl">FLAT</span>
      <input id="fold" type="range" min="0" max="1000" value="1000" aria-label="Faltung">
      <span class="fold-lbl">CASE</span>
      <output id="foldOut" class="fold-out">100</output>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </main>

  <aside class="panel">
    <div class="step-head">
      <span class="step-no" id="stepNo">01</span>
      <h1 class="step-title" id="stepTitle">Mainboard</h1>
      <nav class="dots" id="dots" aria-label="Schritte"></nav>
    </div>

    <!-- 01 Mainboard -->
    <section class="step" data-title="Mainboard">
      <p class="hint">Maße deines Laptop-Mainboards</p>
      <div class="field">
        <label for="L">Länge</label>
        <div class="num"><input type="number" id="L" data-k="L" min="100" max="400" inputmode="numeric"><span>mm</span></div>
        <input type="range" data-k="L" min="100" max="400" step="1" aria-label="Länge">
      </div>
      <div class="field">
        <label for="B">Breite</label>
        <div class="num"><input type="number" id="B" data-k="B" min="80" max="300" inputmode="numeric"><span>mm</span></div>
        <input type="range" data-k="B" min="80" max="300" step="1" aria-label="Breite">
      </div>
      <div class="field">
        <label for="Hc">Bauhöhe</label>
        <div class="num"><input type="number" id="Hc" data-k="Hc" min="8" max="60" inputmode="numeric"><span>mm</span></div>
        <input type="range" data-k="Hc" min="8" max="60" step="1" aria-label="Bauhöhe">
      </div>
    </section>

    <!-- 02 IO -->
    <section class="step" data-title="Anschlüsse" hidden>
      <p class="hint">Ausbrech-Raster <span class="muted">· Mehrfachwahl</span></p>
      <div class="chips io-grid" id="ioSides">
        <button class="chip" data-side="front">Vorne<b>○</b></button>
        <button class="chip" data-side="back">Hinten<b>●</b></button>
        <button class="chip" data-side="left">Links<b>●</b></button>
        <button class="chip" data-side="right">Rechts<b>○</b></button>
      </div>
      <p class="hint">Plättchen-Größe</p>
      <div class="seg" id="tileSeg">
        <button data-v="6">6 mm</button>
        <button data-v="8" class="on">8 mm</button>
        <button data-v="10">10 mm</button>
      </div>
    </section>

    <!-- 03 Finish -->
    <section class="step" data-title="Oberfläche" hidden>
      <p class="hint">Farbe <span class="muted" id="finishName"></span></p>
      <div class="swatches" id="swatches"></div>
      <p class="hint">Lüftung</p>
      <div class="seg" id="ventSeg">
        <button data-v="dots">Punkte</button>
        <button data-v="slots">Schlitze</button>
        <button data-v="none">Keine</button>
      </div>
    </section>

    <!-- 04 Engrave -->
    <section class="step" data-title="Gravur" hidden>
      <p class="hint">Text</p>
      <input class="text-in" id="engrText" maxlength="18" autocomplete="off" spellcheck="false" placeholder="Leer = keine Gravur">
      <div id="engrOpts">
        <p class="hint">Position</p>
        <div class="seg" id="engrSeg">
          <button data-v="top">Oben</button>
          <button data-v="front">Vorne</button>
          <button data-v="side">Seite</button>
        </div>
        <p class="hint">Schrift</p>
        <div class="seg" id="fontSeg">
          <button data-v="pixel" class="f-dot on">Geist Pixel</button>
          <button data-v="mono" class="f-mono">Geist Mono</button>
        </div>
      </div>
    </section>

    <!-- 05 Summary -->
    <section class="step" data-title="Übersicht" hidden>
      <dl class="specs" id="specs"></dl>
      <button class="btn ghost" id="svgBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        Schnittmuster .svg
      </button>
    </section>

    <footer class="nav">
      <button class="btn square" id="prevBtn" aria-label="Zurück">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="btn primary" id="nextBtn"><span id="nextLbl">Weiter</span><i class="btn-dot"></i></button>
    </footer>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
