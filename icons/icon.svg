<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3e3df"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#efefed"/>

  <!-- Subtle grid dots -->
  <g fill="#d8d8d4">
    <circle cx="96" cy="96" r="3"/>
    <circle cx="160" cy="96" r="3"/>
    <circle cx="224" cy="96" r="3"/>
    <circle cx="288" cy="96" r="3"/>
    <circle cx="352" cy="96" r="3"/>
    <circle cx="416" cy="96" r="3"/>

    <circle cx="96" cy="416" r="3"/>
    <circle cx="160" cy="416" r="3"/>
    <circle cx="224" cy="416" r="3"/>
    <circle cx="288" cy="416" r="3"/>
    <circle cx="352" cy="416" r="3"/>
    <circle cx="416" cy="416" r="3"/>
  </g>

  <!-- Main case plate (sheet-metal folded shape) -->
  <rect x="86" y="86" width="340" height="340" rx="36" fill="url(#metal)" stroke="#0e0e0e" stroke-width="12" filter="url(#shadow)"/>

  <!-- Fold line guides -->
  <path d="M146 86 L146 426" stroke="#c0c0ba" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M366 86 L366 426" stroke="#c0c0ba" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M86 146 L426 146" stroke="#c0c0ba" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M86 366 L426 366" stroke="#c0c0ba" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Corner notch reliefs -->
  <circle cx="146" cy="146" r="10" fill="#efefed" stroke="#0e0e0e" stroke-width="6"/>
  <circle cx="366" cy="146" r="10" fill="#efefed" stroke="#0e0e0e" stroke-width="6"/>
  <circle cx="146" cy="366" r="10" fill="#efefed" stroke="#0e0e0e" stroke-width="6"/>
  <circle cx="366" cy="366" r="10" fill="#efefed" stroke="#0e0e0e" stroke-width="6"/>

  <!-- Motherboard chip / Heart center emblem -->
  <rect x="186" y="186" width="140" height="140" rx="14" fill="#0e0e0e"/>

  <!-- Heart pulse / geometric heart lines in chip -->
  <path d="M222 248 C222 232 238 222 256 238 C274 222 290 232 290 248 C290 268 256 288 256 288 C256 288 222 268 222 248 Z" 
        fill="#efefed"/>

  <!-- Corner indicator LED (iconic red dot) -->
  <circle cx="386" cy="126" r="14" fill="#d71921"/>
  <circle cx="386" cy="126" r="6" fill="#ff5a60"/>

  <!-- Brand label "2H" in minimal industrial style -->
  <text x="256" y="132" font-family="'Geist Mono', monospace, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#0e0e0e" letter-spacing="4" text-anchor="middle">2NDHEART</text>
  <text x="256" y="394" font-family="'Geist Mono', monospace, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#8c8c88" letter-spacing="3" text-anchor="middle">CHASSIS 01</text>
</svg>
